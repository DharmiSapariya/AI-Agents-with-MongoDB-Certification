name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
        # these tests use mongomock and a scripted model; they do not touch Atlas
      - run: cd backend && ruff check . ../scripts
      - run: cd backend && mypy app
      - run: cd backend && pytest -q
